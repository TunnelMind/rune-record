[package]
name = "rune-record"
version = "0.1.0"
edition = "2021"
description = "ADR-001 attestation receipts + ADR-002 manifest validation for Rune nodes"
license = "Apache-2.0"
repository = "https://github.com/TunnelMind/rune-record"
readme = "README.md"
keywords = ["receipt", "attestation", "ed25519", "jcs"]
categories = ["cryptography"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
ring = "0.17"
anyhow = "1"
hex = "0.4"
base64 = "0.22"
toml = "0.8"
time = "0.3"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
# raw_value lets tests/jcs_vectors.rs parse each vector on its own: three
# vectors carry lone-surrogate inputs serde_json refuses, which would fail a
# whole-file parse. Feature only, no new crate.
serde_json = { version = "1", features = ["raw_value"] }
